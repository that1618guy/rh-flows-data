name: Flows data

# Reads Robinhood Chain once a day and publishes four pages to docs/ (GitHub Pages):
# flows.html, holders.html, smart.html and valuation.html, plus status.json (pages.yml deploys docs/).
on:
  schedule:
    - cron: "40 0 * * *"      # 00:40 UTC: the previous UTC day is complete
  workflow_dispatch:          # run it by hand from the Actions tab

permissions:
  contents: write             # to commit docs/

concurrency:
  group: daily-refresh        # never two runs at once
  cancel-in-progress: false

jobs:
  flows:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: "Flows: restore the chain cache"
        id: flows_cache
        uses: actions/cache/restore@v4
        with:
          path: data/flows_cache
          key: flows-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: flows-

      - name: "Flows: seed an empty cache"
        if: steps.flows_cache.outputs.cache-matched-key == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data/flows_cache
          if gh release download cache-seed --pattern cache_seed.tar.gz --dir "$RUNNER_TEMP"; then
            tar -xzf "$RUNNER_TEMP/cache_seed.tar.gz" -C data/flows_cache
          else
            echo "::warning title=Flows::no cache-seed release, starting from yesterday"
          fi

      - name: "Flows: read the chain"
        id: read
        continue-on-error: true
        timeout-minutes: 60
        run: >-
          python scripts/flows_engine.py --universe data/flows_universe.json --cache data/flows_cache
          --days 30 --max-new 3 --budget-min 20 --workers 3

      - name: "Flows: build the page"
        id: flows
        run: python scripts/build_flows_page.py data/flows_cache data/flows_cache/page.html

      - name: "Holders: seed empty states"
        if: hashFiles('data/flows_cache/holders/*.state.json.gz') == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data/flows_cache/holders
          gh release download cache-seed --pattern cache_seed.tar.gz --dir "$RUNNER_TEMP" --skip-existing \
            && tar -xzf "$RUNNER_TEMP/cache_seed.tar.gz" -C data/flows_cache ./holders \
            || echo "::warning title=Holders::no holder states in the cache-seed release"

      - name: "Holders: roll forward and build"
        id: holders
        continue-on-error: true
        run: |
          for f in data/flows_cache/holders/*.state.json.gz; do python scripts/holders_state.py roll "$f" data/flows_cache; done
          python scripts/build_holders_page.py data/flows_cache/holders data/flows_cache/holders.html data/flows_universe.json data/flows_cache

      - name: "Smart money: build"
        id: smart
        continue-on-error: true
        run: python scripts/build_smart_page.py data/flows_cache data/flows_cache/smart.html

      - name: "Projects: revenue multiple"
        id: valuation
        continue-on-error: true
        run: |
          python scripts/revenue_multiple.py data/flows_cache/valuation.json
          python scripts/build_valuation_page.py data/flows_cache/valuation.json data/flows_cache/valuation.html "$(date -u -d yesterday +%F)"

      - name: "Flows: save the chain cache"
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/flows_cache
          key: flows-${{ github.run_id }}-${{ github.run_attempt }}

      # Publish whatever pages exist (a failed step leaves its last good page in place), with status.json
      # recording each page's as-of date, what it shows and which steps failed.
      - name: Publish to docs/
        if: always()
        env:
          READ: ${{ steps.read.outcome }}
          FLOWS: ${{ steps.flows.outcome }}
          HOLDERS: ${{ steps.holders.outcome }}
          SMART: ${{ steps.smart.outcome }}
          VALUATION: ${{ steps.valuation.outcome }}
        run: |
          mkdir -p docs
          for p in page.html:flows.html holders.html:holders.html smart.html:smart.html valuation.html:valuation.html; do
            src="data/flows_cache/${p%%:*}"; [ -f "$src" ] && cp "$src" "docs/${p##*:}"
          done
          python - <<'PY'
          import datetime as dt, json, os, re
          def data(path, data_id):
              try:
                  s = open(path, encoding="utf-8").read()
              except OSError:
                  return None, ""
              m = re.search(rf'<script type="application/json" id="{data_id}">(.*?)</script>', s, re.S)
              return (json.loads(m.group(1)) if m else None), s
          st = {"built": dt.datetime.now(dt.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"), "pages": {}}
          f, _ = data("docs/flows.html", "flows-data")
          st["pages"]["flows.html"] = f and {"asof": f["asof"], "tokens": len(f["tokens"]), "windows": list(f["windows"])}
          h, _ = data("docs/holders.html", "h-data")
          st["pages"]["holders.html"] = h and {"asof": h["asof"], "tokens": len(h["tokens"]), "not_shown": h.get("stale", []),
                                               "not_scored": h.get("unpriced", []) + h.get("unbuildable", [])}
          s, _ = data("docs/smart.html", "sm-data")
          st["pages"]["smart.html"] = s and {"asof": s["asof"], "day": s["day"], "wallets": s["n_smart"], "tokens": len(s["tokens"])}
          v, raw = data("docs/valuation.html", "val-data")
          d = re.search(r"DefiLlama through ([A-Z][a-z]{2} \d{1,2}, \d{4})", raw)
          st["pages"]["valuation.html"] = v and {"asof": d and dt.datetime.strptime(d.group(1), "%b %d, %Y").date().isoformat(),
                                                 "projects": len(v["rows"])}
          steps = {"read the chain": "READ", "flows page": "FLOWS", "holders": "HOLDERS", "smart money": "SMART", "revenue multiple": "VALUATION"}
          st["failures"] = [k for k, e in steps.items() if os.environ.get(e) not in ("success", "skipped", "")]
          json.dump(st, open("docs/status.json", "w"), indent=1)
          print(json.dumps(st, indent=1))
          PY
          touch docs/.nojekyll
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          git diff --cached --quiet && exit 0
          git commit -m "Flows data $(date -u -d yesterday +%F)"
          git pull --rebase
          git push

  pages:
    needs: flows
    if: always()
    uses: ./.github/workflows/pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
