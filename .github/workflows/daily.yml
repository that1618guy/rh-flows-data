name: Flows data

# Reads Robinhood Chain once a day and publishes to docs/ (GitHub Pages; pages.yml deploys it): the home, Flows,
# Smart money and Holders pages (home.html, flows.html, smart.html, holders.html), the token logos (logos/), the
# revenue multiple's data for the Projects page (valuation.json), and status.json.
# Started at 00:45 UTC by the sob-rh-trigger Cloudflare Worker (GitHub's own schedule can run hours late, so it is only
# the backup). When it finishes, site-data.yml starts. A catch-up run (started by site-data.yml 2 hours later when
# capital or the site data came up a day short) reads capital again and rebuilds the home page, nothing else.
run-name: ${{ inputs.catchup && 'Flows data, catch-up' || 'Flows data' }}
on:
  schedule:
    - cron: "40 0 * * *"      # backup only: the Worker starts the run at 00:45 UTC
  workflow_dispatch:          # the Worker, or by hand from the Actions tab
    inputs:
      catchup:
        description: "Catch-up: read capital again and rebuild the home page only"
        type: boolean
        default: false

permissions:
  contents: write             # to commit docs/

concurrency:
  group: daily-refresh        # never two runs at once
  cancel-in-progress: false

jobs:
  flows:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: "Flows: restore the chain cache"
        id: flows_cache
        uses: actions/cache/restore@v4
        with:
          path: data/flows_cache
          key: flows-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: flows-

      - name: "Flows: seed an empty cache"
        if: steps.flows_cache.outputs.cache-matched-key == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data/flows_cache
          if gh release download cache-seed --pattern cache_seed.tar.gz --dir "$RUNNER_TEMP"; then
            tar -xzf "$RUNNER_TEMP/cache_seed.tar.gz" -C data/flows_cache
          else
            echo "::warning title=Flows::no cache-seed release, starting from yesterday"
          fi

      # The token list keeps itself (scripts/universe.py; the rules are at the top of that file, the hand overrides in
      # data/universe_rules.json). Before the read only the hand overrides are applied: no network, no time. A token
      # blocked by hand is off tonight's pages. Everything slow is at the end of the job.
      - name: "Token list: hand overrides"
        if: ${{ !inputs.catchup }}
        continue-on-error: true
        timeout-minutes: 5
        run: >-
          python scripts/universe.py rules --universe data/flows_universe.json --state data/universe_state.json
          --rules data/universe_rules.json --cache data/flows_cache --docs docs

      # Clear the folders of tokens that are no longer on the list. A no-op on most nights.
      - name: "Flows: drop tokens that left the universe"
        run: |
          python - <<'PY'
          import json, os, shutil
          keep = {t["symbol"] for t in json.load(open("data/flows_universe.json"))}
          for d in sorted(os.listdir("data/flows_cache")):
              p = os.path.join("data/flows_cache", d)
              if os.path.isfile(os.path.join(p, "meta.json")) and d not in keep:
                  shutil.rmtree(p); print("removed", d)
          PY

      - name: "Flows: read the chain"
        if: ${{ !inputs.catchup }}
        id: read
        continue-on-error: true
        timeout-minutes: 60
        run: >-
          python scripts/flows_engine.py --universe data/flows_universe.json --cache data/flows_cache
          --days 30 --max-new 3 --budget-min 20 --workers 3

      - name: "Capital: seed empty state"
        if: hashFiles('data/flows_cache/capital/USDG.json') == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data/flows_cache/capital
          gh release download capital-seed --pattern capital_seed.tar.gz --dir "$RUNNER_TEMP" \
            && tar -xzf "$RUNNER_TEMP/capital_seed.tar.gz" -C data/flows_cache/capital \
            || echo "::warning title=Capital::no capital-seed release"

      - name: "Token facts and logos"
        if: ${{ !inputs.catchup }}
        id: meta
        continue-on-error: true
        run: python scripts/token_meta.py data/flows_universe.json data/flows_cache/tokens_meta.json data/flows_cache/logos

      - name: "Capital: read"
        id: capital
        continue-on-error: true
        run: python scripts/capital.py data/flows_cache data/flows_cache/capital.json

      - name: "Holders: seed empty states"
        if: hashFiles('data/flows_cache/holders/*.state.json.gz') == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data/flows_cache/holders
          gh release download cache-seed --pattern cache_seed.tar.gz --dir "$RUNNER_TEMP" --skip-existing \
            && tar -xzf "$RUNNER_TEMP/cache_seed.tar.gz" -C data/flows_cache ./holders \
            || echo "::warning title=Holders::no holder states in the cache-seed release"

      - name: "Holders: roll forward"
        if: ${{ !inputs.catchup }}
        id: roll
        continue-on-error: true
        run: |
          # One token never stops the rest: a state whose token left the cache is skipped, a failed roll is warned
          # about and the loop goes on, and the step fails at the end if any roll failed (status.json records it).
          failed=""
          for f in data/flows_cache/holders/*.state.json.gz; do
            sym=$(basename "$f" .state.json.gz)
            if [ ! -d "data/flows_cache/$sym" ]; then echo "$sym: no token folder in the cache, skipped"; continue; fi
            python scripts/holders_state.py roll "$f" data/flows_cache || { echo "::warning title=Holders::$sym didn't roll forward"; failed="$failed $sym"; }
          done
          if [ -n "$failed" ]; then echo "roll failed for:$failed"; exit 1; fi

      - name: "Page: home"
        id: home
        continue-on-error: true
        run: python scripts/build_home.py data/flows_cache data/flows_cache/home.html

      - name: "Page: flows"
        if: ${{ !inputs.catchup }}
        id: flows
        continue-on-error: true
        run: python scripts/build_flows_page.py data/flows_cache data/flows_cache/page.html

      - name: "Page: smart money"
        if: ${{ !inputs.catchup }}
        id: smart
        continue-on-error: true
        run: python scripts/build_smart_page.py data/flows_cache data/flows_cache/smart.html

      - name: "Page: holders"
        if: ${{ !inputs.catchup }}
        id: holders
        continue-on-error: true
        run: python scripts/build_holders_page.py data/flows_cache data/flows_cache/holders.html

      - name: "Smart Filter: restore the log"
        if: ${{ !inputs.catchup && hashFiles('data/flows_cache/smart_filter_log.json') == '' }}
        run: "[ -f docs/smart_filter_log.json ] && cp docs/smart_filter_log.json data/flows_cache/smart_filter_log.json || true"

      - name: "Page: smart filter"
        if: ${{ !inputs.catchup }}
        id: filter
        continue-on-error: true
        run: python scripts/build_smart_filter_page.py data/flows_cache data/flows_cache/smart-filter.html

      - name: "Projects: revenue multiple"
        if: ${{ !inputs.catchup }}
        id: valuation
        continue-on-error: true
        run: python scripts/revenue_multiple.py data/flows_cache/valuation.json

      - name: "Alerts: post to Discord"
        if: ${{ !inputs.catchup }}
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python scripts/post_alerts.py data/flows_cache data/universe_state.json

      # Last, so the list never holds up the pages or the Discord post. First the night is counted: who has gone
      # quiet and is dropped, who has passed the rule and starts being read in. What changes here shows on the pages
      # from the next run. A failure changes nothing: the list stays as it stood.
      - name: "Token list: count the night"
        if: ${{ !inputs.catchup }}
        id: list
        continue-on-error: true
        timeout-minutes: 30
        run: >-
          python scripts/universe.py scan --universe data/flows_universe.json --state data/universe_state.json
          --rules data/universe_rules.json --cache data/flows_cache --docs docs

      # Then a newcomer's 30 days of flows and its holder scan go to data/flows_cache/warming/, apart from the listed
      # tokens. It joins the list only once both are complete, and is on the pages from the next run. A big token
      # takes several nights; the scan carries on where it stopped.
      - name: "Token list: read in newcomers"
        if: ${{ !inputs.catchup }}
        id: warm
        continue-on-error: true
        timeout-minutes: 90
        run: >-
          python scripts/universe.py warm --universe data/flows_universe.json --state data/universe_state.json
          --rules data/universe_rules.json --cache data/flows_cache --docs docs --budget-min 60

      - name: "Flows: save the chain cache"
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/flows_cache
          key: flows-${{ github.run_id }}-${{ github.run_attempt }}

      # Publish whatever exists (a failed step leaves its last good file in place), with status.json recording each
      # page's date, the logos and which steps failed.
      - name: Publish to docs/
        if: always()
        env:
          READ: ${{ steps.read.outcome }}
          META: ${{ steps.meta.outcome }}
          CAPITAL: ${{ steps.capital.outcome }}
          ROLL: ${{ steps.roll.outcome }}
          HOME: ${{ steps.home.outcome }}
          FLOWS: ${{ steps.flows.outcome }}
          SMART: ${{ steps.smart.outcome }}
          HOLDERS: ${{ steps.holders.outcome }}
          VALUATION: ${{ steps.valuation.outcome }}
          FILTER: ${{ steps.filter.outcome }}
          LIST: ${{ steps.list.outcome }}
          WARM: ${{ steps.warm.outcome }}
        run: |
          mkdir -p docs/logos
          for p in home.html:home.html page.html:flows.html smart.html:smart.html holders.html:holders.html valuation.json:valuation.json smart-filter.html:smart-filter.html smart_filter_log.json:smart_filter_log.json; do
            src="data/flows_cache/${p%%:*}"; [ -f "$src" ] && cp "$src" "docs/${p##*:}"
          done
          [ -d data/flows_cache/logos ] && cp -f data/flows_cache/logos/* docs/logos/ 2>/dev/null || true
          rm -f docs/valuation.html        # the section is built by the site now, from valuation.json
          python - <<'PY'
          import datetime as dt, json, os, re
          st = {"built": dt.datetime.now(dt.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"), "pages": {}}
          for f, i in (("home.html", "home"), ("flows.html", "flows"), ("smart.html", "smart-money"), ("holders.html", "holders"), ("smart-filter.html", "smart-filter")):
              try:
                  s = open(os.path.join("docs", f), encoding="utf-8").read()
              except OSError:
                  st["pages"][f] = None; continue
              m = re.search(r'<span class="stamp">([^<]*)</span>', s)
              st["pages"][f] = {"stamp": m and m.group(1), "data": f'id="{i}-data"' in s, "bytes": len(s.encode())}
          try:
              v = json.load(open("docs/valuation.json"))
              st["pages"]["valuation.json"] = {"asof": (dt.datetime.now(dt.timezone.utc).date() - dt.timedelta(days=1)).isoformat()
                                               if os.environ.get("VALUATION") == "success" else None, "projects": len(v.get("rows") or [])}
          except (OSError, ValueError):
              st["pages"]["valuation.json"] = None
          old = {}
          try:
              old = (json.load(open("docs/status.json"))["pages"].get("valuation.json") or {})
          except (OSError, ValueError, KeyError, AttributeError):
              pass
          if st["pages"]["valuation.json"] and not st["pages"]["valuation.json"]["asof"]:
              st["pages"]["valuation.json"]["asof"] = old.get("asof")        # a failed fetch keeps the last good file and its date
          st["logos"] = sorted(os.listdir("docs/logos"))
          try:                         # how far capital reached: site-data.yml starts a catch-up run when it's a day short
              st["capital"] = {"through": json.load(open("data/flows_cache/capital.json"))["asof"]}
          except (OSError, ValueError, KeyError):
              st["capital"] = None
          steps = {"read the chain": "READ", "token facts": "META", "capital": "CAPITAL", "holders roll": "ROLL", "home": "HOME",
                   "flows": "FLOWS", "smart money": "SMART", "holders": "HOLDERS", "revenue multiple": "VALUATION", "smart filter": "FILTER",
                   "token list": "LIST", "token list read-in": "WARM"}
          st["failures"] = [k for k, e in steps.items() if os.environ.get(e) not in ("success", "skipped", "")]
          json.dump(st, open("docs/status.json", "w"), indent=1)
          print(json.dumps(st, indent=1))
          PY
          touch docs/.nojekyll
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs
          git add data/flows_universe.json data/universe_state.json 2>/dev/null || true      # the list and its memory
          git diff --cached --quiet && exit 0
          git commit -m "Flows data $(date -u -d yesterday +%F)"
          git pull --rebase
          git push

  pages:
    needs: flows
    if: always()
    uses: ./.github/workflows/pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
